    <link rel="stylesheet" href="styles/contact.css">
</head>
<body>

    <!-- Header -->
        <header>
                <nav>
                    <a href="index.html" class="logo">
                        <img src="images/logo.jpg" alt="logoIMG">
                    </a>

                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="wedo.html">What we do</a>

                <!-- Hamburger -->
                <div class="hamburger" id="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                </nav>
        </header>


        <section class="contact-section">
            <h1>Contact Us</h1>

            <div class="static-contact">
                <h2>
                    <p>Phone: </p>
                    <p>Email: </p>
                    <p>WhatsApp: </p>
                </h2>
            </div>

            <div class=social-media>
                <h2>Follow Us on</h2>
                <a href="">Facebook</a>
                <a href="">LinkedIn</a>
                <a href="">Tiktok</a>
            </div>
        </section>

        

        <section class="contact-form">

            <div class="form-container">
                <div class="form-content">
                    <span class="close-btn">&times;</span>
                    <h2>Make An Inquiry</h2>

                    <form >
                        
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" placeholder="Type your name here">

                        <label for="email">Email</label>
                        <input type="text" id="email" name="email" placeholder="www.example@gmail.com">
                        
                        <label for="contact">Phone Number</label>
                        <input type="text" id="number" name="number" placeholder="076-353538">
                        
                        <!-- <label for=""></label>
                        <input type="text">
                        
                        <label for=""></label>
                        <input type="text"> -->

                        <label for="message">Tell Us</label>
                        <textarea name="message" id="message" placeholder="Type your message here..."></textarea>
                    
                        <button type="submit">Submit Inquiry</button>
                    </form>


                </div>
            </div>
        </section>
    
</body>
</html>
